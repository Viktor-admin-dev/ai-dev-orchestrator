{% extends "base.html" %}
{% block title %}Bootstrap Project{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <h1 class="text-2xl font-bold mb-2">Bootstrap Project from Spec</h1>
    <p class="text-gray-400 mb-6">Load .md files from a folder on the server, or paste text manually.</p>

    {% if error %}
    <div class="bg-red-900/50 border border-red-700 rounded-lg p-4 mb-6">
        <p class="text-red-300 text-sm font-medium">Error</p>
        <p class="text-red-200 text-sm mt-1">{{ error }}</p>
    </div>
    {% endif %}

    <!-- Option 1: Load from folder -->
    <form method="post" action="/bootstrap/load-folder" id="folder-form" class="mb-6">
        <label class="block text-sm font-medium text-gray-300 mb-2">Path to folder with .md specs</label>
        <div class="flex gap-3">
            <input
                type="text"
                name="folder_path"
                value="{{ folder_path or '' }}"
                placeholder="~/Desktop/MyProject/specs/"
                class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-gray-100 text-sm font-mono focus:border-blue-500"
            />
            <button
                type="submit"
                class="bg-gray-600 hover:bg-gray-500 text-white px-5 py-2 rounded-lg text-sm font-medium transition-colors whitespace-nowrap"
            >
                Load files
            </button>
        </div>
    </form>

    <div class="border-t border-gray-700 my-6"></div>

    <!-- Option 2: Paste or edit loaded text -->
    <form method="post" action="/bootstrap" id="bootstrap-form">
        <label class="block text-sm font-medium text-gray-300 mb-2">Specification text</label>
        <textarea
            name="spec_text"
            rows="16"
            required
            placeholder="Paste your ТЗ / technical specification here, or load from folder above..."
            class="w-full bg-gray-900 border border-gray-700 rounded-lg p-4 text-gray-100 text-sm font-mono resize-y focus:border-blue-500"
        >{{ spec_text }}</textarea>

        <div class="mt-4 flex items-center gap-4">
            <button
                type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg text-sm font-medium transition-colors"
                id="submit-btn"
            >
                Decompose with AI
            </button>
            <div id="spinner" class="bootstrap-spinner hidden">
                <div class="spinner-dot"></div>
                <span class="text-gray-400 text-sm ml-2">AI is analyzing your spec...</span>
            </div>
        </div>
    </form>
</div>

<script>
document.getElementById('bootstrap-form').addEventListener('submit', function() {
    document.getElementById('submit-btn').disabled = true;
    document.getElementById('submit-btn').classList.add('opacity-50');
    document.getElementById('spinner').classList.remove('hidden');
});
</script>
{% endblock %}
