<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Orchestrator{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-3">
        <div class="max-w-7xl mx-auto flex items-center gap-6">
            <a href="/" class="text-lg font-bold text-white">Orchestrator</a>
            <div class="flex gap-4 text-sm">
                <a href="/" class="text-gray-400 hover:text-white">Dashboard</a>
                <a href="/cost" class="text-gray-400 hover:text-white">Cost</a>
                <a href="/actions" class="text-gray-400 hover:text-white">Actions</a>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
