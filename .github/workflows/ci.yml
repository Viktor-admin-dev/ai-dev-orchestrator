name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, Type-check, Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/

      - name: Type-check (mypy)
        run: mypy src/

      - name: Test (pytest)
        run: pytest --cov=orchestrator --cov-report=term-missing

      - name: Coverage — business logic (≥80%)
        run: |
          coverage report --include="src/orchestrator/state_machine.py,src/orchestrator/stage.py,src/orchestrator/evidence.py,src/orchestrator/cost.py,src/orchestrator/runner.py,src/orchestrator/graph.py,src/orchestrator/executor/*.py,src/orchestrator/config.py,src/orchestrator/types.py" --fail-under=80

      - name: Coverage — overall (≥60%)
        run: coverage report --fail-under=60
