[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-dev-orchestrator"
version = "0.1.0"
description = "AI-контур разработки проектов: из ТЗ до работающего продукта"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[project.scripts]
orchestrator = "orchestrator.cli:app"

[project.optional-dependencies]
panel = ["rich>=13.0", "typer>=0.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "rich>=13.0",
    "typer>=0.9",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "claude_agent_sdk.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
